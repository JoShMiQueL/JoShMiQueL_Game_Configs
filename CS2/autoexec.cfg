// CS2 autoexec.cfg — JoShMiQueL
// Monitor 1920x1080 @ 280 Hz · In-game 1280x960 4:3 stretched
// Runs AFTER the user vcfg, so it overrides the in-game menu.
//
// Install: ...\game\csgo\cfg\autoexec.cfg
// Launch options: +exec autoexec.cfg

sensitivity 1.2

// 2. CROSSHAIR
// Share code: CSmT2d8xVhWpvPsbqUSGtVVWuPtjteuOEMcojKDPDjhRfJ
cl_crosshairstyle 4
cl_crosshair_length 2
cl_crosshair_thickness 1
cl_crosshair_gap 1
cl_crosshaircolor_r 255
cl_crosshaircolor_g 0
cl_crosshaircolor_b 0
cl_crosshaircolor_a 255
cl_crosshairdot false
cl_crosshair_t false
cl_crosshair_recoil false
cl_crosshair_drawoutline 0
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_dynamic_splitdist 4
cl_crosshair_dynamic_spread_limit 227
cl_crosshair_dynamic_splitalpha_innermod 1.0
cl_crosshair_dynamic_splitalpha_outermod 0.3
cl_crosshair_dynamic_maxdist_splitratio 0.0
cl_ironsight_dot_scale 1.0
cl_ironsight_usecrosshaircolor false

// 3. AUDIO
// Positional audio. Makes footsteps directional instead of flat stereo.
snd_steamaudio_enable_perspective_correction 1
snd_spatialize_lerp 0.5

volume 0.4

// Mute what carries no information. MVP music is kept.
snd_deathcamera_volume 0
snd_menumusic_volume 0
snd_roundstart_volume 0
snd_roundend_volume 0
snd_tensecondwarning_volume 0.15
snd_mapobjective_volume 0
snd_mvp_volume 0.25

// 4. RADAR
// Bigger radar, using the full area instead of staying centred on you.
cl_radar_scale 0.4
cl_hud_radar_scale 0.9
cl_radar_always_centered 0
cl_radar_icon_scale_min 0.85
cl_radar_rotate true
cl_radar_square_with_scoreboard true

// 5. VISIBILITY
// Boost Player Contrast. Sharpens player models in low-contrast areas.
r_player_visibility_mode 1

// 6. VIEWMODEL
// Weapon model position. Pulls the gun away from the centre so it
// covers less of the screen.
viewmodel_presetpos 0
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -2
viewmodel_fov 68
cl_prefer_lefthanded false

// 7. HUD
r_drawtracers_firstperson true
r_show_build_info false
cl_autohelp false
cl_showloadout true
cl_teamid_overhead_mode 1

// 8. TELEMETRY
// 2 = frametime graph, 1 = ping
cl_hud_telemetry_frametime_show 2
cl_hud_telemetry_ping_show 1

host_writeconfig

echo "autoexec.cfg loaded!"